# Services and the BFF. Images are filled in by scripts/deploy.sh.
---
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: "${WMD_NAMESPACE}" }
spec:
  type: ClusterIP
  selector: { app: catalog }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: "${WMD_NAMESPACE}", labels: { app: catalog } }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: catalog
          image: "${WMD_CATALOG_IMAGE}"
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: wmd-db, key: catalog-password } } }
            - { name: DATABASE_URL, value: "postgresql://catalog_svc:$(DB_PASSWORD)@postgres:5432/wmd" }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata: { name: notification, namespace: "${WMD_NAMESPACE}" }
spec:
  type: ClusterIP
  selector: { app: notification }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification, namespace: "${WMD_NAMESPACE}", labels: { app: notification } }
spec:
  replicas: 1
