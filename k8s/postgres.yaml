# Staging database: one Postgres, one schema and one role per service (db/schemas.sql).
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: "${WMD_NAMESPACE}" }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: "${WMD_NAMESPACE}" }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: wmd }
            - { name: POSTGRES_DB, value: wmd }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: wmd-db, key: admin-password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "wmd"] }
            periodSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: wmd-db-init, namespace: "${WMD_NAMESPACE}" }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:16
          command: ["sh", "/wmd/init.sh"]
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: wmd }
            - { name: PGDATABASE, value: wmd }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: wmd-db, key: admin-password } } }
            - { name: CATALOG_DB_PASSWORD, valueFrom: { secretKeyRef: { name: wmd-db, key: catalog-password } } }
            - { name: ORDERS_DB_PASSWORD, valueFrom: { secretKeyRef: { name: wmd-db, key: orders-password } } }
            - { name: NOTIFICATION_DB_PASSWORD, valueFrom: { secretKeyRef: { name: wmd-db, key: notification-password } } }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts: [{ name: db, mountPath: /wmd }]
      volumes:
        - name: db
          configMap: { name: wmd-db-scripts }
